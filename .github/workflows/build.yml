name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-main:
    name: Build SteelBIM (Release)
    runs-on: windows-latest
    env:
      # Sinaliza pro csproj usar PackageReference Nice3point em vez do
      # HintPath local do Revit 2025. Ver docs/ADR/ADR-005-ci-revit-stubs.md.
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore SteelBIM
        working-directory: SteelBIM
        run: dotnet restore SteelBIM.csproj

      - name: Build SteelBIM (Release)
        working-directory: SteelBIM
        run: dotnet build SteelBIM.csproj --configuration Release --no-restore

  build-tests:
    name: Build & Test SteelBIM.Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore Tests
        working-directory: SteelBIM.Tests
        run: dotnet restore

      - name: Build Tests
        working-directory: SteelBIM.Tests
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        working-directory: SteelBIM.Tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: SteelBIM.Tests/TestResults/

  lint:
    name: Code Quality (dotnet format)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Verify formatting (Tests project)
        working-directory: SteelBIM.Tests
        # Removido continue-on-error em v2.0.2 - apos limpeza de formatting
        # em SteelBIM.Tests. Build deve falhar honesto se formatting quebrar.
        run: dotnet format --verify-no-changes --verbosity diagnostic
