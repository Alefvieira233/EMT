name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# v2.7.7 hardening: cancela runs obsoletos no mesmo ref pra economizar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v2.7.7 hardening: silencia banner do dotnet em logs + opt-out de telemetria
# nos runners (acelera startup minor + privacidade).
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # v2.8.9: licenca migrada para ECDsa P-256 ASSIMETRICO (ADR-011). Nao ha mais
  # segredo HMAC de licenca a configurar — o plugin embarca so a chave PUBLICA de
  # verificacao (LicenseKeys.cs); a privada de assinatura fica so com o produtor.
  # LicenseSecretProvider permanece apenas para o DSN do Sentry (ADR-007).

jobs:
  # v2.8.9 (Onda 1 da auditoria): barreira contra commit acidental de segredos.
  # Complementa o .gitignore (defesa em profundidade para a chave PRIVADA de licenca,
  # cuja exposicao = forja ilimitada). Check de arquivo simples e deterministico.
  secret-guard:
    name: Secret Guard (segredos commitados)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bloquear arquivos de segredo no repositorio
        run: |
          bad=$(git ls-files | grep -E '\.(pfx|key)$|\.sentry\.dsn$|\.posthog\.apikey$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Arquivo de segredo commitado no repositorio:"
            echo "$bad"
            exit 1
          fi
          echo "OK - nenhum arquivo de segredo (.pfx/.key/dsn/apikey) commitado."

  build-main:
    name: Build SteelBIM (Release)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Sinaliza pro csproj usar PackageReference Nice3point em vez do
      # HintPath local do Revit 2025. Ver docs/ADR/ADR-005-ci-revit-stubs.md.
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # v2.7.7: cache NuGet acelera restore de ~45s -> ~8s em PRs repetidos.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-main-${{ hashFiles('SteelBIM/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-main-

      - name: Show .NET info
        run: dotnet --info

      - name: Restore SteelBIM
        working-directory: SteelBIM
        run: dotnet restore SteelBIM.csproj

      - name: Build SteelBIM (Release)
        working-directory: SteelBIM
        run: dotnet build SteelBIM.csproj --configuration Release --no-restore

  build-tests:
    name: Build & Test SteelBIM.Tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # v2.7.7: cache NuGet (key separada de build-main por hashFiles distinto).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tests-${{ hashFiles('SteelBIM.Tests/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-tests-

      - name: Restore Tests
        working-directory: SteelBIM.Tests
        run: dotnet restore

      - name: Build Tests
        working-directory: SteelBIM.Tests
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        working-directory: SteelBIM.Tests
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: SteelBIM.Tests/TestResults/
          # v2.7.7 hardening (auditoria #005): se Test step crashar antes de
          # criar TestResults/, upload silencia (exit 0) e PR fica verde
          # apesar de testes quebrados. 'error' faz upload falhar em vez de
          # silenciar — bug fica visivel no CI summary.
          if-no-files-found: error
          retention-days: 14

      # v2.7.7: publica resultado xUnit como check inline na PR (sumario visivel
      # sem precisar baixar artifact). continue-on-error pq plugin do dorny
      # pode falhar em parsing edge cases — nao queremos quebrar build por isso.
      - name: Test summary (report)
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: xUnit Tests
          path: SteelBIM.Tests/TestResults/*.trx
          reporter: dotnet-trx

  # v2.7.7: job dedicado ao EmtKeyGen (tool em tools/EmtKeyGen). Antes era
  # compilado implicitamente pelo build da solution; agora tem job proprio
  # com cache + artifact upload (uteis pra auditoria HMAC offline).
  build-tool:
    name: Build EmtKeyGen
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-keygen-${{ hashFiles('tools/EmtKeyGen/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-keygen-
      - name: Restore
        run: dotnet restore tools/EmtKeyGen/EmtKeyGen.csproj
      - name: Build EmtKeyGen (Release)
        run: dotnet build tools/EmtKeyGen/EmtKeyGen.csproj -c Release --no-restore
      - name: Upload EmtKeyGen artifact
        uses: actions/upload-artifact@v6
        with:
          name: EmtKeyGen-${{ github.sha }}
          path: tools/EmtKeyGen/bin/Release/
          retention-days: 7
          if-no-files-found: error

  lint:
    name: Code Quality (dotnet format)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # CI=true habilita PackageReference Nice3point (Revit stubs) em vez do
      # HintPath local. Ver docs/ADR/ADR-005-ci-revit-stubs.md.
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Verify formatting (Tests project)
        working-directory: SteelBIM.Tests
        # Removido continue-on-error em v2.0.2 - apos limpeza de formatting
        # em SteelBIM.Tests. Build deve falhar honesto se formatting quebrar.
        run: dotnet format --verify-no-changes --verbosity diagnostic

      # v2.8.9 (Onda 3): gate de formatacao tambem no projeto principal
      # (SteelBIM.csproj). Antes so SteelBIM.Tests era checado, entao codigo
      # mal-formatado em Commands/Services/Views passava no CI.
      - name: Verify formatting (SteelBIM main project)
        run: dotnet format SteelBIM/SteelBIM.csproj --verify-no-changes --verbosity diagnostic

# TODO (multi-Revit, v3.0 fase 1): job matrix building against Revit 2024 /
# 2025 / 2026 reference assemblies. Depende de converter SteelBIM.csproj
# para multi-target (net48;net8.0-windows) e publicar/shimar RevitAPI.dll
# por versao. Plano herdado do patch original 2026-04-18.
