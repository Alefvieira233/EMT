name: Bug Report
description: Algo nao funciona como esperado no plugin
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Preencha com o maximo de detalhe possivel —
        isso encurta drasticamente o tempo de diagnostico.

  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: O que voce estava tentando fazer e o que aconteceu?
      placeholder: "Cliquei em Marcar Pecas com 500 vigas selecionadas e o Revit fechou"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
      description: Sequencia exata que reproduz o problema.
      placeholder: |
        1. Abro Revit 2025
        2. Abro projeto X
        3. Selecionar 500 vigas
        4. Ribbon -> Ferramenta EMT -> Marcar Pecas
        5. Observar o crash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      placeholder: "Cada viga recebe um numero de marca sequencial"
    validations:
      required: true

  - type: dropdown
    id: revit
    attributes:
      label: Versao do Revit
      options:
        - Revit 2025 (suportada)
        - Outro (nao suportada - descrever abaixo)
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Versao do plugin
      description: Ribbon -> SteelBIM | Modelagem -> Sobre -> Versao
      placeholder: "v2.7.10"
    validations:
      required: true

  - type: dropdown
    id: license-state
    attributes:
      label: Estado da licenca
      description: Visivel no painel Licenca do ribbon.
      options:
        - Trial (ativo)
        - Trial expirado
        - Valida (chave perpetua)
        - Nao sei
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log (%LOCALAPPDATA%\SteelBIM\logs)
      description: |
        Cole as ultimas ~50 linhas do log do dia do erro.
        IMPORTANTE: Remova qualquer info sensivel manualmente — embora o
        plugin scrubbe PII automaticamente (paths de usuario, emails, nomes
        de .rvt), revise antes de colar publicamente.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
      description: Screenshots, arquivo Revit reduzido, configuracao especifica, etc.
